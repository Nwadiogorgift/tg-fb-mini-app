<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading...</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f0f2f5;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .box { max-width: 360px; }
    h1 { color: #d93025; margin: 0 0 10px; }
    p { color: #444; line-height: 1.5; }
    .id { margin-top: 20px; color: #777; font-size: 14px; }
    #open-fb {
      display: none;
      margin-top: 16px;
      padding: 12px 24px;
      font-size: 16px;
      border: 0;
      border-radius: 8px;
      background: #1877f2;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Loading state -->
  <div class="box" id="loading"><p>Loading...</p></div>

  <!-- What strangers see -->
  <div class="box" id="access-denied" style="display:none;">
    <h1>Access Denied</h1>
    <p>This is a private bot. You do not have permission to use it.</p>
    <p class="id">Your ID is: <span id="stranger-id"></span></p>
    <p class="id">Send this ID to the owner to request access.</p>
    <p class="id">whatsapp: +2348101501589</p>
  </div>

  <!-- What you (allowed users) see if auto-redirect is blocked -->
  <div class="box" id="allowed" style="display:none;">
    <p>Access granted. Opening Facebook...</p>
    <button id="open-fb">Open Facebook</button>
  </div>

<script>
  // PUT THE TELEGRAM IDs OF ALLOWED PEOPLE HERE (numbers, separated by commas)
  const ALLOWED_USERS = [8563876793, 849850000, 7615626442];

  const FACEBOOK_URL = "https://www.facebook.com";

  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const userId = tg.initDataUnsafe?.user?.id;

  const show = (id) => {
    document.getElementById("loading").style.display = "none";
    document.getElementById(id).style.display = "block";
  };

  if (userId && ALLOWED_USERS.includes(userId)) {
    show("allowed");
    const btn = document.getElementById("open-fb");
    btn.style.display = "inline-block";
    btn.onclick = () => tg.openLink(FACEBOOK_URL);

    // Try to go to Facebook automatically
    window.location.href = FACEBOOK_URL;
  } else {
    document.getElementById("stranger-id").textContent = userId || "Unknown (open this inside Telegram)";
    show("access-denied");
  }
</script>

</body>
</html>
